# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The NeoForge version must agree with the Minecraft version to get a valid artifact
neoforge_version=21.1.172
# The NeoForge version range can use any version of NeoForge as bounds or match the loader version range
neoforge_version_range=[21.1,)
# The loader version range can only use the major version of NeoForge/FML as bounds
loader_version_range=[21.1,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.21.1

## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=spartanweaponry
# The human-readable display name for the mod.
mod_name=Spartan Weaponry
mod_jar_name=SpartanWeaponry
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=Apache License v2.0
# The mod version. See https://semver.org/
mod_version=3.1.3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.oblivioussp.spartanweaponry
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=ObliviousSpartan
mod_credits=xwerffx for the weapon ideas and most of the art. Translators: alexvirgo13 (Spanish) and SplashedTomato (Russian)
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Weapons Galore! A whole new arsenal of weaponry made for Minecraft.

Inspired by Balkon's WeaponMod, it adds new versions of weapons from that mod, as well expanding the arsenal with a bunch of original weapons.
jei_version=15.8.0.12
curios_version=9.5.1
mixin_extras_version=0.3.5
shoulder_surfing_version_range=[1.21.1-4.1.1,)